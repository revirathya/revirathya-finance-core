services:
  finance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revirathya
      POSTGRES_PASSWORD: revirathya
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revirathya -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  finance-migration:
    image: revirathya/revirathya-finance-migration:0.0.1
    depends_on:
      finance-db:
        condition: service_healthy
    command: ["-database", "${DATABASE_URI}", "up"]

  finance-core:
    image: revirathya/revirathya-finance-core:latest
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "50051:50051"

volumes:
  pgdata:
