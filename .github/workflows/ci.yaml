name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./test
      - run: go test -race -tags=integration ./test/internal/repository/...
      # - run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./... # Paused until production target ready
  
  migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgres://test:test@localhost:5432/testdb?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
      - run: migrate -path migrations -database "$DATABASE_URI" up
      - run: migrate -path migrations -database "$DATABASE_URI" down --all
      - run: migrate -path migrations -database "$DATABASE_URI" up

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install generators (matching README)
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: buf lint
      - run: |
          buf generate
          sqlc generate
          go run github.com/99designs/gqlgen generate
      - name: Fail if generated code is out of date
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
