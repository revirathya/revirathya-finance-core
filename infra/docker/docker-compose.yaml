services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-revirathya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-finance}
    ports:
      - "5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-revirathya} -d ${DB_NAME:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  migration:
    image: revirathya/revirathya-finance-migration:${MIGRATION_VERSION:?MIGRATION_VERSION is required}
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - "migrate"
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-revirathya}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-finance}?sslmode=disable"
    command:
      - "up"

  core:
    image: revirathya/revirathya-finance-core:${VERSION:?VERSION is required}
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      APP_ENV: "${APP_ENV:-prod}"
      DATABASE_URI: "postgres://${DB_USER:-revirathya}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-finance}?sslmode=disable"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GRPC_API_KEY: "${GRPC_API_KEY:?GRPC_API_KEY is required}"
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      METRICS_PORT: "9090"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL: ${JWT_TTL:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${GRPC_HOST_PORT:-51051}:50051"
      - "${HTTP_HOST_PORT:-8180}:8080"
      - "127.0.0.1:${METRICS_HOST_PORT:-9900}:9090"
    healthcheck:
      test: ["CMD", "/app/financecore", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
