schema:
  - graphql/schema/*.graphql

exec:
  package: grapqhl
  layout: follow-schema
  dir: gen/graphql

autobind:
  - "github.com/revirathya/revirathya-finance-core/internal/delivery/graphql/error"

model:
  package: model
  filename: gen/graphql/model/models_gen.go

resolver:
  package: resolver
  layout: follow-schema
  dir: internal/delivery/graphql/resolver
  filename_template: "{name}.resolver.go"