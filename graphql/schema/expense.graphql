type Expense {
    id: UUID!
    userId: UUID!
    transactionDt: Date!
    categoryId: UUID!
    categoryName: String!
    description: String!
    amount: Decimal!
}

type ExpenseConnection {
    nodes: [Expense!]!
    pageInfo: PageInfo!
}

input CreateExpenseInput {
    transactionDt: Date!
    categoryId: UUID!
    description: String
    amount: Decimal!
}

input UpdateExpenseInput {
    "Omit any field to keep its value; description \"\" clears it."
    transactionDt: Date
    categoryId: UUID
    description: String
    amount: Decimal
}

extend type Query {
    expense(id: UUID!): Expense

    "Newest first. `first`: page size, default 20, max 50."
    expenses(transactionDt: Date, first: Int, after: String): ExpenseConnection!
}

extend type Mutation {
    createExpense(input: CreateExpenseInput!): Expense
    updateExpense(id: UUID!, patch: UpdateExpenseInput!): Expense
    deleteExpense(id: UUID!): UUID!
}