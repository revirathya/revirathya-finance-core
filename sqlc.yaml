version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_init_schema.up.sql"
      - "migrations/000002_add_user_auth.up.sql"
      - "migrations/000003_add_telegram_bind.up.sql"
      - "migrations/000004_categories_per_user.up.sql"
      - "migrations/000005_expense_description_not_null.up.sql"
      - "migrations/000006_expense_pagination_index.up.sql"
    queries: "sqlc/queries"
    gen:
      go:
        package: "sqlc"
        out: "gen/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
