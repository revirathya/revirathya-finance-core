syntax = "proto3";

package financecore.v1;

import "google/type/date.proto";
import "google/type/decimal.proto";

option go_package = "github.com/revirathya/revirathya-finance-core/gen/grpc/financecore/v1;financecorev1";

// An expense owned by the calling user, including the name of its category.
message Expense {
  // Expense ID (UUID).
  string id = 1;

  // ID of the user who owns the expense (UUID).
  string user_id = 2;

  // ID of the expense's category (UUID).
  string category_id = 3;

  // Name of the expense's category.
  string category_name = 4;

  // Date of the transaction.
  google.type.Date transaction_dt = 5;

  // Free-text note; empty when there is none.
  string description = 6;

  // Amount, an exact decimal with at most 2 decimal places, e.g. value "12500.50".
  google.type.Decimal amount = 7;
}

// Request for CreateExpense.
message CreateExpenseRequest {
  // ID of one of the caller's categories (UUID).
  string category_id = 1;

  // Date of the transaction: a real calendar date from 2000-01-01 to tomorrow (Asia/Jakarta).
  google.type.Date transaction_dt = 2;

  // Free-text note, at most 500 characters, trimmed. Unset means none ("").
  optional string description = 3;

  // Amount: greater than 0, at most 2 decimal places, below 1,000,000,000,000.
  google.type.Decimal amount = 5;

  // Optional UUID; retrying with the same request_id returns the expense the first call created instead of creating another; reusing it for a different expense is INVALID_ARGUMENT.
  optional string request_id = 6;
}

// Response for CreateExpense.
message CreateExpenseResponse {
  // The created expense, as stored.
  Expense expense = 1;
}

// Request for ListExpenses.
message ListExpensesRequest {
  // If set, only expenses on this date.
  optional google.type.Date transaction_dt = 1;

  // Maximum expenses to return: 0 or unset means 20, values above 50 are capped at 50, negative is
  // INVALID_ARGUMENT.
  int32 page_size = 2;

  // next_page_token from the previous response; empty for the first page. Opaque: don't build or parse it.
  string page_token = 3;
}

// Response for ListExpenses.
message ListExpensesResponse {
  // The caller's expenses, newest transaction_dt first (ties by ID).
  repeated Expense expenses = 1;

  // Token for the next page; empty when this is the last page. Stop when it's empty, not when a page is short.
  string next_page_token = 2;
}

// Request for GetExpenseByID.
message GetExpenseByIDRequest {
  // Expense ID (UUID).
  string id = 1;
}

// Response for GetExpenseByID.
message GetExpenseByIDResponse {
  // The requested expense.
  Expense expense = 1;
}

// Request for UpdateExpense. Every field except id is optional: unset fields keep their current value.
message UpdateExpenseRequest {
  // ID of the expense to update (UUID).
  string id = 1;

  // ID of one of the caller's categories (UUID). Unset keeps the current category.
  optional string category_id = 2;

  // Date of the transaction, with the same rules as CreateExpense. Unset keeps the current date.
  google.type.Date transaction_dt = 3;

  // Free-text note, at most 500 characters, trimmed. Unset keeps it; "" clears it.
  optional string description = 4;

  // Amount, with the same rules as CreateExpense. Unset keeps the current amount.
  google.type.Decimal amount = 5;
}

// Response for UpdateExpense.
message UpdateExpenseResponse {
  // The expense after the update, as stored.
  Expense expense = 1;
}

// Request for DeleteExpense.
message DeleteExpenseRequest {
  // ID of the expense to delete (UUID).
  string id = 1;
}

// Response for DeleteExpense. Empty: success is the OK status.
message DeleteExpenseResponse {}

// ExpenseService manages the calling user's expenses.
//
// Every call needs the metadata "authorization: Bearer <api key>" and "x-telegram-user-id: <Telegram user
// ID>" of a bound Telegram account; otherwise it fails with UNAUTHENTICATED. Calls without a deadline time
// out after 10 seconds (DEADLINE_EXCEEDED). Validation errors are INVALID_ARGUMENT with a message naming the
// field, e.g. "amount: must be greater than 0".
service ExpenseService {
  // Creates an expense and returns it as stored.
  //
  // Errors: INVALID_ARGUMENT (malformed or invalid field, or a category that isn't the caller's),
  // UNAUTHENTICATED.
  rpc CreateExpense(CreateExpenseRequest) returns (CreateExpenseResponse);

  // Returns one of the caller's expenses.
  //
  // Errors: INVALID_ARGUMENT (id is not a UUID), NOT_FOUND (no such expense for the caller, including
  // another user's), UNAUTHENTICATED.
  rpc GetExpenseByID(GetExpenseByIDRequest) returns (GetExpenseByIDResponse);

  // Returns the caller's expenses, newest transaction_dt first, one page at a time, optionally only those
  // on one date.
  //
  // Errors: INVALID_ARGUMENT (invalid date, negative page_size, invalid page_token), UNAUTHENTICATED.
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse);

  // Updates an expense: only the fields that are set change. Returns the expense as stored. The owner
  // (user_id) can't be changed.
  //
  // Errors: INVALID_ARGUMENT (malformed or invalid field, or a category that isn't the caller's),
  // NOT_FOUND (no such expense for the caller), UNAUTHENTICATED.
  rpc UpdateExpense(UpdateExpenseRequest) returns (UpdateExpenseResponse);

  // Deletes one of the caller's expenses.
  //
  // Errors: INVALID_ARGUMENT (id is not a UUID), NOT_FOUND (no such expense for the caller, including one
  // already deleted), UNAUTHENTICATED.
  rpc DeleteExpense(DeleteExpenseRequest) returns (DeleteExpenseResponse);
}
