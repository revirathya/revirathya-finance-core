syntax = "proto3";

package financecore.v1;

option go_package = "github.com/revirathya/revirathya-finance-core/gen/grpc/financecore/v1;financecorev1";

// The calling user's conversation state with the Telegram bot. conversation, state and the interaction IDs
// are defined by the bot; this service only stores them (trimmed, at most 100 characters each).
message UserTelegramContext {
  // Context ID (UUID).
  string id = 1;

  // ID of the user the context belongs to (UUID).
  string user_id = 2;

  // Telegram account bound to the user. Unique: one Telegram account per user.
  optional string telegram_chat_id = 3;

  // The bot's active conversation; unset if none was stored.
  optional string conversation = 4;

  // The current step within the conversation; unset if none was stored.
  optional string state = 5;

  // Chat ID of the message the bot is currently interacting with; unset if none was stored.
  optional string interaction_chat_id = 6;

  // ID of the message the bot is currently interacting with; unset if none was stored.
  optional string interaction_message_id = 7;
}

// Request for GetUserTelegramContext. The user comes from the caller's Telegram binding.
message GetUserTelegramContextRequest {}

// Response for GetUserTelegramContext.
message GetUserTelegramContextResponse {
  // The caller's context.
  UserTelegramContext user_telegram_context = 1;
}

// Request for UpdateUserTelegramContext. Every field is optional: unset fields keep their current value, and ""
// stores an empty value.
message UpdateUserTelegramContextRequest {
  // The bot's active conversation, at most 100 characters.
  optional string conversation = 1;

  // The current step within the conversation, at most 100 characters.
  optional string state = 2;

  // Chat ID of the message the bot is interacting with, at most 100 characters.
  optional string interaction_chat_id = 3;

  // ID of the message the bot is interacting with, at most 100 characters.
  optional string interaction_message_id = 4;
}

// Response for UpdateUserTelegramContext.
message UpdateUserTelegramContextResponse {
  // The caller's context after the update.
  UserTelegramContext user_telegram_context = 1;
}

// Request for BindTelegramAccount.
message BindTelegramAccountRequest {
  // One-time code the user created in the Web Console: exactly XXXX-XXXX, uppercase, valid for 10 minutes.
  string code = 1;
}

// Response for BindTelegramAccount.
message BindTelegramAccountResponse {
  // ID of the user the Telegram account is now bound to (UUID).
  string user_id = 1;

  // The user's first name, e.g. so the bot can reply "Bound to Avi's account".
  string first_name = 2;
}

// UserTelegramContextService binds Telegram accounts to users and stores each user's conversation state with
// the bot. Every user has at most one context.
//
// Every call needs the metadata "authorization: Bearer <api key>" and "x-telegram-user-id: <Telegram user
// ID>". The Telegram account must be bound for every RPC except BindTelegramAccount; otherwise the call fails
// with UNAUTHENTICATED. Calls without a deadline time out after 10 seconds (DEADLINE_EXCEEDED).
service UserTelegramContextService {
  // Returns the caller's context.
  //
  // Errors: UNAUTHENTICATED.
  rpc GetUserTelegramContext(GetUserTelegramContextRequest) returns (GetUserTelegramContextResponse);

  // Updates the caller's context: only the fields that are set change. telegram_chat_id can't be changed
  // here; rebind instead.
  //
  // Errors: INVALID_ARGUMENT (a field over 100 characters; the message names it), UNAUTHENTICATED.
  rpc UpdateUserTelegramContext(UpdateUserTelegramContextRequest) returns (UpdateUserTelegramContextResponse);

  // Binds the calling Telegram account (from the "x-telegram-user-id" metadata) to the user who created the
  // code, and resets that user's conversation state. The only RPC an unbound Telegram account may call.
  //
  // Errors: INVALID_ARGUMENT (the code is malformed, unknown, expired or already used), ALREADY_EXISTS
  // (this Telegram account is bound to another user; unbind it there first), RESOURCE_EXHAUSTED (more than
  // 10 attempts per Telegram account in 5 minutes), UNAUTHENTICATED (missing API key or Telegram user ID).
  rpc BindTelegramAccount(BindTelegramAccountRequest) returns (BindTelegramAccountResponse);
}
