type User {
    id: ID!
    firstName: String!
    lastName: String
    email: String!
    telegramChatId: String
}

type AuthPayload {
    token: String!
    expiresAt: String! # REF 3339
    user: User!
}

input UpdateUserInput {
    firstName: String!
    lastName: String
}

extend type Query {
    me: User
}

extend type Mutation {
    loginWithGoogle(idToken: String!): AuthPayload!
    updateUser(input: UpdateUserInput!): User!
}
