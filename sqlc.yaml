version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_init_schema.up.sql"
    queries: "internal/repository/sqlc/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlc/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
